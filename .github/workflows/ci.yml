name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Types (mypy)
        run: mypy $(git ls-files '*.py')

      - name: Synthetic data is reproducible
        run: |
          python synthetic-data/generate.py
          git diff --exit-code -- synthetic-data/sample

      - name: Build Bronze and Gold
        run: |
          python projects/02-etl-consolidation-pattern/src/consolidate.py
          python projects/02-etl-consolidation-pattern/src/build_gold.py

      - name: Tests with coverage (fails below the floor set in pyproject.toml)
        run: |
          coverage run tools/run_tests.py
          coverage report

      - name: Evaluation set
        run: python projects/03-staged-assistant-architecture/src/evaluate.py

      - name: SQL layer (queries and privacy audit)
        run: |
          python projects/04-sql-analytics-layer/src/warehouse.py turnover_ranking
          python projects/04-sql-analytics-layer/src/warehouse.py privacy_audit

      - name: Publication guard (generic checks)
        run: python tools/guard.py
